name: build-and-deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  IMAGE: us-central1-docker.pkg.dev/haderach-ai/haderach-apps/site-api
  REGION: us-central1
  SERVICE: site-api

jobs:
  build-deploy:
    name: Build image and deploy to Cloud Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4
        with:
          path: site

      # shared-ui is a local file dependency (@haderach/shared-ui)
      - name: Checkout haderach-home (shared-ui)
        uses: actions/checkout@v4
        with:
          repository: heymichael/haderach-home
          token: ${{ secrets.CROSS_REPO_PAT }}
          path: haderach-home

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          SHA=$(cd site && git rev-parse --short HEAD)
          # Build context is workspace root so Dockerfile can reach both repos
          docker build \
            -f site/Dockerfile \
            -t "$IMAGE:$SHA" \
            -t "$IMAGE:latest" \
            .
          docker push "$IMAGE:$SHA"
          docker push "$IMAGE:latest"

      - name: Deploy to Cloud Run
        run: |
          SHA=$(cd site && git rev-parse --short HEAD)
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE:$SHA" \
            --region "$REGION" \
            --project haderach-ai \
            --quiet

      - name: Post-deploy smoke test
        run: |
          SERVICE_URL=$(gcloud run services describe "$SERVICE" \
            --region "$REGION" --project haderach-ai \
            --format='value(status.url)')
          sleep 5
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$SERVICE_URL/health")
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "Smoke test failed: expected 200, got $HTTP_CODE"
            exit 1
          fi
          echo "Smoke test passed: $SERVICE_URL/health returned $HTTP_CODE"
