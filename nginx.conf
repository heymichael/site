server {
    listen 8080;
    root /app/dist;

    location = /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Static assets have hashed filenames — cache aggressively
    location /site/assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routing: serve index.html for all /site/* paths
    location /site/ {
        try_files $uri $uri/index.html /site/index.html;
    }
}
